name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read version name
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove existing release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.name }}" --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect release APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HyperOS-BackTap-Pay-v${{ steps.version.outputs.name }}-release.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-BackTap-Pay-v${{ steps.version.outputs.name }}-release
          path: out/HyperOS-BackTap-Pay-v${{ steps.version.outputs.name }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: HyperOS BackTap Pay v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: out/HyperOS-BackTap-Pay-v${{ steps.version.outputs.name }}-release.apk
