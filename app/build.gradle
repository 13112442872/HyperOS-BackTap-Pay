plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mike.hyperosbacktappay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mike.hyperosbacktappay'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
